{% extends "base.html" %} {% block content %}

<div class="container mt-5">
  <div class="card shadow-lg">
    <div class="card-header bg-primary text-white">
      <h2>🩸 Diabetes Prediction</h2>
    </div>

    <div class="card-body">
      <form action="/diabetes_predict" method="POST">
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Patient Name</label>
            <input
              type="text"
              name="patient_name"
              class="form-control"
              placeholder="Enter Patient Name"
              required
            />
          </div>

          <div class="col-md-6">
            <label class="form-label">Patient Age</label>
            <input
                  type="number"
                  class="form-control"
                  name="patient_age"
                  min="1"
                  max="120"
                  required>
          </div>
            
          <div class="col-md-3 mb-3">
            <label>Pregnancies</label>

            <input
              type="number"
              name="Pregnancies"
              class="form-control"
              required
            />
          </div>

          <div class="col-md-3 mb-3">
            <label>Glucose</label>

            <input type="number" name="Glucose" class="form-control" required />
          </div>

          <div class="col-md-3 mb-3">
            <label>Blood Pressure</label>

            <input
              type="number"
              name="BloodPressure"
              class="form-control"
              required
            />
          </div>

          <div class="col-md-3 mb-3">
            <label>Skin Thickness</label>

            <input type="number" name="SkinThickness" class="form-control" />
          </div>

          <div class="col-md-3 mb-3">
            <label>Insulin</label>

            <input type="number" name="Insulin" class="form-control" />
          </div>

          <div class="col-md-3 mb-3">
            <label>BMI</label>

            <input type="number" step="0.1" name="BMI" class="form-control" />
          </div>

          <div class="col-md-3 mb-3">
            <label>Diabetes Pedigree Function</label>

            <input
              type="number"
              step="0.001"
              name="DiabetesPedigreeFunction"
              class="form-control"
            />
          </div>

  

        <div class="text-center mt-4">
          <button class="btn btn-primary btn-lg">Predict Diabetes</button>
        </div>
      </form>
    </div>
  </div>
</div>

{% endblock %}
