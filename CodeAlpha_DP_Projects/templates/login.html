{% extends "base.html" %}

{% block content %}

<div class="login-box">

<h2>User Login</h2>

<form action="/login_user" method="POST">

<input
type="email"
name="email"
placeholder="Email"
required
class="form-control mb-3">

<input
type="password"
name="password"
placeholder="Password"
required
class="form-control mb-3">

<button class="btn btn-primary w-100">

Login

</button>

</form>

<br>

<p>

Don't have an account?

<a href="/register">

Register

</a>

</p>

</div>

{% endblock %}
