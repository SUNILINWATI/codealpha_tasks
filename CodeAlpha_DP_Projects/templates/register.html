{% extends "base.html" %}

{% block content %}

<div class="register-box">

<h2>Create Account</h2>

<form action="/register_user" method="POST">

<input
type="text"
name="name"
placeholder="Full Name"
required
class="form-control mb-3">

<input
type="email"
name="email"
placeholder="Email"
required
class="form-control mb-3">

<input
type="password"
name="password"
placeholder="Password"
required
class="form-control mb-3">

<input
type="number"
name="age"
placeholder="Age"
required
class="form-control mb-3">

<select
name="gender"
class="form-control mb-3">

<option>Male</option>

<option>Female</option>

<option>Other</option>

</select>

<button class="btn btn-success w-100">

Register

</button>

</form>

</div>

{% endblock %}
