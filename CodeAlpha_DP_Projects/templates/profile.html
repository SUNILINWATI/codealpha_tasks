{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

<div class="card shadow-lg">

<div class="card-header bg-success text-white">

<h3>

My Profile

</h3>

</div>

<div class="card-body">

<form action="/update_profile" method="POST">

<div class="mb-3">

<label>Name</label>

<input
type="text"
class="form-control"
name="name"
value="{{ user.name }}"
required>

</div>

<div class="mb-3">

<label>Email</label>

<input
type="email"
class="form-control"
value="{{ user.email }}"
readonly>

</div>

<div class="mb-3">

<label>Age</label>

<input
type="number"
class="form-control"
name="age"
value="{{ user.age }}">

</div>

<div class="mb-3">

<label>Gender</label>

<select
class="form-select"
name="gender">

<option
{% if user.gender=="Male" %}
selected
{% endif %}
>

Male

</option>

<option
{% if user.gender=="Female" %}
selected
{% endif %}
>

Female

</option>

</select>

</div>

<button
class="btn btn-success">

Update Profile

</button>

</form>

<hr>

<h4>

Change Password

</h4>

<form action="/change_password" method="POST">

<div class="mb-3">

<input
type="password"
name="current_password"
class="form-control"
placeholder="Current Password"
required>

</div>

<div class="mb-3">

<input
type="password"
name="new_password"
class="form-control"
placeholder="New Password"
required>

</div>

<button
class="btn btn-danger">

Change Password

</button>

</form>

</div>

</div>

</div>

{% endblock %}
