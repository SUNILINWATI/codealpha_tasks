{% extends "base.html" %}

{% block title %}Edit Profile{% endblock %}

{% block content %}

<div class="row justify-content-center">

<div class="col-md-6">

<div class="card shadow">

<div class="card-header bg-primary text-white">

<h3>Edit Profile</h3>

</div>

<div class="card-body">

<form method="POST">

<div class="mb-3">

<label>Full Name</label>

<input
type="text"
name="fullname"
class="form-control"
value="{{ user[0] }}"
required>

</div>

<div class="mb-3">

<label>Email</label>

<input
type="email"
name="email"
class="form-control"
value="{{ user[1] }}"
required>

</div>

<button class="btn btn-success w-100">

Update Profile

</button>

</form>

</div>

</div>

</div>

</div>

{% endblock %}
