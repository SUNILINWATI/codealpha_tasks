<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Verify OTP</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />

    <style>
      body {
        background: linear-gradient(135deg, #0d6efd, #6610f2);

        height: 100vh;

        display: flex;

        justify-content: center;

        align-items: center;

        font-family: Poppins, sans-serif;
      }

      .card {
        width: 450px;

        border: none;

        border-radius: 20px;

        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      }

      .logo {
        font-size: 60px;

        color: #0d6efd;
      }

      .form-control {
        height: 50px;

        border-radius: 10px;

        text-align: center;

        font-size: 22px;

        letter-spacing: 5px;

        font-weight: bold;
      }

      .btn-verify {
        height: 50px;

        border-radius: 10px;

        font-size: 18px;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <div class="card-body p-5">
        <div class="text-center mb-4">
          <i class="fa-solid fa-shield-halved logo"></i>

          <h2 class="fw-bold mt-3">OTP Verification</h2>

          <p class="text-muted">Enter the 6-digit OTP sent to your email</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %} {% if
        messages %} {% for category, message in messages %}

        <div class="alert alert-{{ category }}">{{ message }}</div>

        {% endfor %} {% endif %} {% endwith %}

        <form method="POST">
          <div class="mb-4">
            <label class="form-label"> Enter OTP </label>

            <input
              type="text"
              name="otp"
              maxlength="6"
              class="form-control"
              placeholder="123456"
              required
            />
          </div>

          <button type="submit" class="btn btn-success w-100 btn-verify">
            <i class="fa-solid fa-check"></i>

            Verify OTP
          </button>
        </form>

        <hr />

        <div class="text-center">
          <a href="{{ url_for('auth.forgot_password') }}">
            <i class="fa-solid fa-arrow-left"></i>

            Back
          </a>
        </div>
      </div>
    </div>
  </body>
</html>
