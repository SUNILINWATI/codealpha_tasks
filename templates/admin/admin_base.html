<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="d-flex">

    <!-- Sidebar -->

    <div class="bg-dark text-white p-3" style="width:250px;min-height:100vh;">

        <h3>Admin Panel</h3>

        <hr>

        <a href="{{ url_for('admin.admin_dashboard') }}" class="d-block text-white mb-3">
            Dashboard
        </a>

        <a href="{{ url_for('admin.users') }}" class="d-block text-white mb-3">
            Users
        </a>

        <a href="{{ url_for('admin.predictions') }}" class="d-block text-white mb-3">
            Predictions
        </a>

        <a href="{{ url_for('admin.admin_logout') }}" class="d-block text-white">
            Logout
        </a>

    </div>

    <!-- Content -->

    <div class="container-fluid p-4">

        {% block content %}

        {% endblock %}

    </div>

</div>

</body>
</html>
