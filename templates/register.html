<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Credit AI - Register</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />

    <style>
      body {
        background: linear-gradient(135deg, #198754, #0d6efd);

        height: 100vh;

        display: flex;

        justify-content: center;

        align-items: center;

        font-family: Poppins, sans-serif;
      }

      .register-card {
        width: 500px;

        border: none;

        border-radius: 20px;

        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      }

      .logo {
        font-size: 60px;

        color: #198754;
      }

      .form-control {
        height: 48px;

        border-radius: 10px;
      }

      .btn-register {
        height: 50px;

        border-radius: 10px;

        font-size: 18px;
      }
    </style>
  </head>

  <body>
    <div class="card register-card">
      <div class="card-body p-5">
        <div class="text-center mb-4">
          <i class="fa-solid fa-user-plus logo"></i>

          <h2 class="fw-bold mt-3">Create Account</h2>

          <p class="text-muted">Credit AI Loan Prediction System</p>
        </div>

        {% with messages=get_flashed_messages(with_categories=true) %} {% if
        messages %} {% for category,message in messages %}

        <div class="alert alert-{{category}}">{{message}}</div>

        {% endfor %} {% endif %} {% endwith %}

        <form method="POST">
          <div class="mb-3">
            <label>Full Name</label>

            <input type="text" name="fullname" class="form-control" required />
          </div>

          <div class="mb-3">
            <label>Email</label>

            <input type="email" name="email" class="form-control" required />
          </div>

          <div class="mb-3">
            <label>Password</label>

            <input
              type="password"
              name="password"
              class="form-control"
              required
            />
          </div>

          <div class="mb-4">
            <label>Confirm Password</label>

            <input
              type="password"
              name="confirm_password"
              class="form-control"
              required
            />
          </div>

          <button class="btn btn-success w-100 btn-register">
            <i class="fa-solid fa-user-check"></i>

            Register
          </button>
        </form>

        <hr />

        <div class="text-center">
          Already have an account?

          <a href="{{ url_for('auth.login') }}"> Login </a>
        </div>
      </div>
    </div>
  </body>
</html>
